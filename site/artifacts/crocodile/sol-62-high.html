<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a332a">
  <title>鳄鱼骑自行车</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #1a332a;
      color: #fff1cf;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(20px, 4vw, 54px);
      background: radial-gradient(ellipse at 50% 0%, #2c4e3d, #1a332a 74%);
    }

    main { width: min(100%, 1180px); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px 24px;
      flex-wrap: wrap;
      margin: 0 0 clamp(14px, 2.3vw, 26px);
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      font-size: clamp(1.8rem, 5vw, 3.75rem);
      line-height: 1.12;
      letter-spacing: .065em;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #81907a;
      border-radius: 999px;
      padding: 10px 16px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: .875rem;
      white-space: nowrap;
    }

    button[hidden], button[data-paused="true"] .pause-icon,
    button[data-paused="false"] .play-icon { display: none; }
    button:hover { background: #fff1cf18; }
    button:focus-visible { outline: 2px solid #efbf64; outline-offset: 4px; }
    button svg { width: 13px; height: 13px; }

    .poster {
      overflow: hidden;
      border: 1px solid #f9e9c688;
      border-radius: clamp(12px, 2vw, 24px);
      background: #f5e3bc;
      box-shadow: 0 20px 48px #0c231c66;
    }

    #ride {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
