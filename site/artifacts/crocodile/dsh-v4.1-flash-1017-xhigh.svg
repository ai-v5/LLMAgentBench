<svg id='crocodile-bike' viewBox='0 0 1000 700' role='img' aria-labelledby='svg-title svg-desc' xmlns='http://www.w3.org/2000/svg'>
<title id='svg-title'>鳄鱼骑自行车</title>
<desc id='svg-desc'>一只绿色鳄鱼骑着橙色自行车，车轮持续旋转，双腿同步踩踏，身体轻轻摆动。</desc>
<defs>
  <linearGradient id='skyGrad' x1='0' y1='0' x2='0' y2='1'>
    <stop offset='0%' stop-color='#ccefff'/>
    <stop offset='58%' stop-color='#eafbe1'/>
    <stop offset='100%' stop-color='#fff5d8'/>
  </linearGradient>
  <radialGradient id='sunGrad' cx='50%' cy='42%' r='60%'>
    <stop offset='0%' stop-color='#fff9c9'/>
    <stop offset='65%' stop-color='#ffe27a'/>
    <stop offset='100%' stop-color='#f6c85f'/>
  </radialGradient>
  <linearGradient id='frameGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#ffb347'/>
    <stop offset='55%' stop-color='#f26b3a'/>
    <stop offset='100%' stop-color='#c74930'/>
  </linearGradient>
  <linearGradient id='bodyGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
    <stop offset='0%' stop-color='#8bd15d'/>
    <stop offset='48%' stop-color='#5fb046'/>
    <stop offset='100%' stop-color='#3d8438'/>
  </linearGradient>
  <linearGradient id='headGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#86cc59'/>
    <stop offset='55%' stop-color='#58a841'/>
    <stop offset='100%' stop-color='#3e8337'/>
  </linearGradient>
  <linearGradient id='bellyGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
    <stop offset='0%' stop-color='#d8ee91'/>
    <stop offset='100%' stop-color='#a7d16c'/>
  </linearGradient>
  <filter id='softShadow' x='-30%' y='-30%' width='160%' height='160%'>
    <feDropShadow dx='0' dy='5' stdDeviation='4' flood-color='#295c32' flood-opacity='.23'/>
  </filter>
  <filter id='wheelShadow' x='-40%' y='-40%' width='180%' height='180%'>
    <feDropShadow dx='0' dy='4' stdDeviation='3' flood-color='#1d2a2d' flood-opacity='.25'/>
  </filter>
</defs>

