<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鳄鱼骑自行车</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e8f8f5; font-family: sans-serif; }
    svg { display: block; width: min(900px, 100%); height: auto; }
  </style>
</head>
<body>
<svg viewBox="0 0 800 500" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">鳄鱼骑自行车</title>
  <desc id="desc">一只绿色鳄鱼骑着自行车，车轮转动，双腿交替踩踏。</desc>
  <rect width="800" height="500" fill="#e8f8f5"/>
  <circle cx="690" cy="85" r="37" fill="#ffdc76"/>
  <path d="M0 390 Q160 370 320 390 T640 390 T960 390 V500 H0Z" fill="#b4ddbd"/>
  <path d="M0 415 H800" stroke="#75b493" stroke-width="4"/>

  <!-- 车轮：轮辐与轮胎一起绕各自中心连续转动。 -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(220 345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <circle r="92" stroke="#354956" stroke-width="12"/>
        <circle r="81" stroke="#f9f7e9" stroke-width="3"/>
        <path d="M-81 0H81 M0-81V81 M-57-57L57 57 M57-57L-57 57" stroke="#77939b" stroke-width="3"/>
        <circle r="7" fill="#354956" stroke="none"/>
      </g>
    </g>
    <g transform="translate(580 345)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <circle r="92" stroke="#354956" stroke-width="12"/>
        <circle r="81" stroke="#f9f7e9" stroke-width="3"/>
        <path d="M-81 0H81 M0-81V81 M-57-57L57 57 M57-57L-57 57" stroke="#77939b" stroke-width="3"/>
        <circle r="7" fill="#354956" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- 车架、车座和车把。 -->
  <g fill="none" stroke="#e97755" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 345 L340 230 L395 345 Z M340 230 L520 230 L395 345 M520 230 L580 345"/>
    <path d="M520 230 L504 194" stroke="#354956" stroke-width="8"/>
    <path d="M488 194 H535 Q546 194 546 184" stroke="#354956" stroke-width="8"/>
    <path d="M340 230 L331 206" stroke="#354956" stroke-width="8"/>
    <path d="M305 205 Q332 196 356 205" stroke="#354956" stroke-width="10"/>
  </g>

  <!-- 曲柄和踏板与车轮同周期旋转。 -->
  <g transform="translate(395 345)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <path d="M-31 0 H31" stroke="#354956" stroke-width="7" stroke-linecap="round"/>
      <path d="M-39 0 H-23 M23 0 H39" stroke="#263b46" stroke-width="8" stroke-linecap="round"/>
      <circle r="8" fill="#354956"/>
    </g>
  </g>

  <!-- 双腿以相同周期、相反相位上下踩踏。 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 215 Q355 258 377 283 L364 333" stroke="#438f55" stroke-width="22">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M340 215 Q355 258 377 283 L364 345; M340 215 Q347 250 370 268 L395 314; M340 215 Q365 252 405 283 L426 345; M340 215 Q365 280 400 310 L395 376; M340 215 Q355 258 377 283 L364 345"/>
    </path>
    <path d="M364 345 h18" stroke="#306d42" stroke-width="12">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M364 345 h18; M395 314 h18; M426 345 h18; M395 376 h18; M364 345 h18"/>
    </path>
    <path d="M365 215 Q385 260 405 283 L426 345" stroke="#64ae69" stroke-width="22">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M365 215 Q385 260 405 283 L426 345; M365 215 Q385 280 400 310 L395 376; M365 215 Q355 258 377 283 L364 345; M365 215 Q347 250 370 268 L395 314; M365 215 Q385 260 405 283 L426 345"/>
    </path>
    <path d="M426 345 h18" stroke="#438f55" stroke-width="12">
      <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M426 345 h18; M395 376 h18; M364 345 h18; M395 314 h18; M426 345 h18"/>
    </path>
  </g>

  <!-- 鳄鱼身体、尾巴、头部和手臂整体轻微摆动。 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 345 215; 2 345 215; -2 345 215" dur="1.2s" repeatCount="indefinite"/>
    <path d="M305 184 Q246 203 193 166 Q217 218 304 218Z" fill="#58a960" stroke="#367b49" stroke-width="4"/>
    <path d="M225 188 l-8-15 18 12 3-15 15 19 6-15 14 20" fill="#367b49"/>
    <ellipse cx="350" cy="188" rx="75" ry="48" transform="rotate(-12 350 188)" fill="#65b96e" stroke="#367b49" stroke-width="4"/>
    <path d="M304 182 l4-19 13 13 8-19 12 14 9-18 11 14" fill="#367b49"/>
    <path d="M418 158 Q435 152 447 163 L493 174 Q503 177 499 187 Q493 198 480 199 L434 196 Q410 194 400 180 Q394 169 418 158Z" fill="#65b96e" stroke="#367b49" stroke-width="4"/>
    <path d="M445 193 l6 8 5-7 7 7 5-6 6 5 4-5" fill="#fffdf2" stroke="#367b49" stroke-width="2"/>
    <circle cx="432" cy="159" r="13" fill="#65b96e" stroke="#367b49" stroke-width="4"/>
    <circle cx="435" cy="158" r="4" fill="#263b46"/>
    <circle cx="483" cy="179" r="3" fill="#367b49"/>
    <path d="M387 181 Q414 187 438 213 L503 194" fill="none" stroke="#438f55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="503" cy="194" r="9" fill="#65b96e" stroke="#367b49" stroke-width="3"/>
  </g>
</svg>
</body>
</html>
