      <path d='M588 248 l5 9 l5 -8 z'/>
      <path d='M611 246 l5 9 l5 -8 z'/>
      <path d='M634 244 l5 9 l5 -8 z'/>
      <path d='M657 242 l5 8 l5 -7 z'/>
    </g>
    <path d='M538 213 Q546 198 562 202 Q570 205 568 214' fill='#5ab548' stroke='#235c33' stroke-width='3'/>
    <ellipse cx='553' cy='214' rx='11' ry='9' fill='#fff9cf' stroke='#235c33' stroke-width='2'/>
    <ellipse cx='556' cy='214' rx='3' ry='7' fill='#1f2b22'/>
    <circle cx='550' cy='211' r='2' fill='#ffffff'/>
    <ellipse cx='680' cy='228' rx='4' ry='2.5' fill='#24532c'/>
    <path d='M607 219 q8 -5 16 0' fill='none' stroke='#2e7938' stroke-width='3' stroke-linecap='round' opacity='.8'/>
    <circle cx='625' cy='229' r='2' fill='#2e7938' opacity='.6'/>
    <circle cx='646' cy='226' r='2' fill='#2e7938' opacity='.6'/>

    <!-- 近侧手臂与手 -->
