      <path d='M425 300 L470 445'/>
      <path d='M425 300 L595 295'/>
      <path d='M595 295 L610 350'/>
      <path d='M610 350 L470 445'/>
      <path d='M610 350 Q627 394 640 445'/>
    </g>
    <path d='M425 300 L425 277' stroke='#4d5a57' stroke-width='7'/>
    <path d='M595 295 L595 260' stroke='#4d5a57' stroke-width='7'/>
    <path d='M567 258 Q595 242 624 258' stroke='#333b3d' stroke-width='7'/>
    <path d='M564 256 L575 262' stroke='#202729' stroke-width='11'/>
    <path d='M616 256 L628 262' stroke='#202729' stroke-width='11'/>
  </g>

  <!-- 链条与牙盘 -->
  <g fill='none' stroke-linecap='round'>
    <path d='M470 421 L300 437' stroke='#6b7c78' stroke-width='3' stroke-dasharray='5 4'/>
    <path d='M470 469 L300 453' stroke='#6b7c78' stroke-width='3' stroke-dasharray='5 4'/>
    <circle cx='470' cy='445' r='27' stroke='#d7e2df' stroke-width='4'/>
    <circle cx='470' cy='445' r='27' stroke='#7e9690' stroke-width='2' stroke-dasharray='3 5'/>
    <circle cx='470' cy='445' r='7' fill='#4c5c58' stroke='#cbd8d5' stroke-width='3'/>
  </g>

  <!-- 车座 -->
  <g filter='url(#softShadow)'>
    <path d='M391 298 Q421 279 457 296 Q456 310 421 311 Q397 311 391 298 Z' fill='#2e3438'/>
    <path d='M398 298 Q421 286 449 297' fill='none' stroke='#586166' stroke-width='3' opacity='.7'/>
  </g>

  <!-- 曲柄与踏板，与车轮同步旋转 -->
  <g transform='translate(470 445)'>
    <g>
      <animateTransform attributeName='transform' attributeType='XML' type='rotate' from='0' to='360' dur='1.8s' repeatCount='indefinite'/>
      <line x1='0' y1='0' x2='34' y2='0' stroke='#4d5a57' stroke-width='7' stroke-linecap='round'/>
      <line x1='0' y1='0' x2='-34' y2='0' stroke='#4d5a57' stroke-width='7' stroke-linecap='round'/>
      <rect x='23' y='-7' width='23' height='14' rx='4' fill='#252c31' stroke='#0f171b' stroke-width='2'/>
      <rect x='-46' y='-7' width='23' height='14' rx='4' fill='#252c31' stroke='#0f171b' stroke-width='2'/>
      <circle cx='34' cy='0' r='3.5' fill='#cfdad7'/>
      <circle cx='-34' cy='0' r='3.5' fill='#cfdad7'/>
    </g>
  </g>

  <!-- 鳄鱼骑手，身体轻微前后摆动 -->
  <g>
    <animateTransform attributeName='transform' type='rotate' values='-1.8 430 334; 1.8 430 334; -1.8 430 334' dur='1.8s' repeatCount='indefinite' calcMode='spline' keyTimes='0;0.5;1' keySplines='0.45 0 0.55 1;0.45 0 0.55 1'/>

    <!-- 尾巴 -->
    <path d='M421 316 C382 316 354 300 327 305 C303 310 301 331 323 340 C349 351 386 354 421 351 Z' fill='url(#crocSkin)' stroke='#235c33' stroke-width='4'/>
    <path d='M327 305 l-9 -11 l14 3 l2 -12 l9 13 l11 -6 l-2 14' fill='#2f7e3d' stroke='#235c33' stroke-width='2' stroke-linejoin='round'/>

    <!-- 身体 -->
    <path d='M395 316 C388 286 394 252 420 233 C443 216 477 219 497 239 C514 257 511 292 497 314 C479 341 444 351 415 342 C404 338 398 329 395 316 Z' fill='url(#crocSkin)' stroke='#235c33' stroke-width='4'/>
    <path d='M416 338 C446 349 480 337 496 310 C491 334 469 348 440 348 C428 348 420 344 416 338 Z' fill='url(#belly)' opacity='.95'/>
    <path d='M413 248 l-12 -9 l4 16 l-15 -2 l10 12' fill='#3f9342' stroke='#235c33' stroke-width='2' stroke-linejoin='round'/>
    <path d='M445 231 l-5 -13 l10 10 l5 -12 l5 13' fill='#3f9342' stroke='#235c33' stroke-width='2' stroke-linejoin='round'/>
    <path d='M477 234 l1 -13 l7 12 l7 -10 l0 13' fill='#3f9342' stroke='#235c33' stroke-width='2' stroke-linejoin='round'/>

    <!-- 远侧手臂 -->
    <path d='M491 266 C522 290 550 301 584 278' fill='none' stroke='#2d7338' stroke-width='23' stroke-linecap='round' stroke-linejoin='round'/>
    <path d='M491 266 C522 290 550 301 584 278' fill='none' stroke='#438e40' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/>
    <ellipse cx='590' cy='275' rx='14' ry='11' fill='#438e40' stroke='#235c33' stroke-width='2' transform='rotate(-18 590 275)'/>

    <!-- 头部 -->
    <path d='M493 250 C501 226 520 210 548 207 L612 207 C640 207 661 212 681 220 C696 226 702 234 692 241 L665 245 L645 249 L610 253 L560 257 C532 259 510 262 493 250 Z' fill='url(#crocSkin)' stroke='#235c33' stroke-width='4'/>
    <path d='M548 255 L665 247 C681 249 681 261 662 266 L580 273 C558 274 542 267 548 255 Z' fill='url(#belly)' stroke='#235c33' stroke-width='3'/>
    <path d='M551 250 C593 248 631 243 677 239' fill='none' stroke='#245630' stroke-width='3' stroke-linecap='round'/>
    <g fill='#fffdf0' stroke='#aeb79b' stroke-width='1'>
