    <path d='M430 336 C464 360 480 386 474 408 C471 424 457 437 442 442' fill='none' stroke='#347b3d' stroke-width='22' stroke-linecap='round' stroke-linejoin='round'/>
    <ellipse cx='439' cy='444' rx='19' ry='9' fill='#347b3d' stroke='#225f33' stroke-width='2' transform='rotate(-8 439 444)'/>
    <path d='M427 445 l-8 4 M438 450 l-7 4 M450 449 l-6 3' stroke='#225f33' stroke-width='2' stroke-linecap='round'/>
  </g>

