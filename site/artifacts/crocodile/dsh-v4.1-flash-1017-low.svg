  <!-- 速度线 -->
  <g stroke='#ffffff' stroke-width='4' stroke-linecap='round' opacity='.65'>
    <path d='M86 392 h58'/>
    <path d='M110 416 h38'/>
    <path d='M68 440 h50'/>
