    <path d='M505 277 C538 307 570 304 599 278' fill='none' stroke='#6bc451' stroke-width='21' stroke-linecap='round' stroke-linejoin='round'/>
    <ellipse cx='603' cy='273' rx='16' ry='12' fill='#6bc451' stroke='#235c33' stroke-width='2' transform='rotate(-20 603 273)'/>
    <path d='M596 266 q8 -4 14 1 M596 272 q9 -3 15 2 M596 278 q7 -1 12 3' fill='none' stroke='#235c33' stroke-width='2' stroke-linecap='round'/>
  </g>

  <!-- 近侧腿，在车架前方 -->
  <g>
    <animateTransform attributeName='transform' type='rotate' values='-12 438 342; 12 438 342; -12 438 342' dur='1.8s' repeatCount='indefinite'/>
    <path d='M438 342 C472 366 494 392 490 414 C488 430 500 440 512 442' fill='none' stroke='#2d7338' stroke-width='29' stroke-linecap='round' stroke-linejoin='round'/>
    <path d='M438 342 C472 366 494 392 490 414 C488 430 500 440 512 442' fill='none' stroke='#6bc451' stroke-width='22' stroke-linecap='round' stroke-linejoin='round'/>
