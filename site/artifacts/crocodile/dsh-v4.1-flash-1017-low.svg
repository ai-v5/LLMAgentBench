  <g fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <g stroke='#8d2d28' stroke-width='14' opacity='.35'>
      <path d='M300 445 L425 300'/>
      <path d='M300 445 L470 445'/>
      <path d='M425 300 L470 445'/>
      <path d='M425 300 L595 295'/>
      <path d='M595 295 L610 350'/>
      <path d='M610 350 L470 445'/>
      <path d='M610 350 Q627 394 640 445'/>
      <path d='M425 300 L425 277'/>
      <path d='M595 295 L595 260'/>
    </g>
