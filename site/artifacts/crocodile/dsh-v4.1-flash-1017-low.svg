<svg class='scene' viewBox='0 0 900 600' role='img' aria-labelledby='title desc' xmlns='http://www.w3.org/2000/svg'>
  <title id='title'>鳄鱼骑自行车</title>
  <desc id='desc'>一只绿色鳄鱼骑着自行车，两个车轮连续旋转，双腿交替踩踏，身体轻轻前后摆动。</desc>

  <defs>
    <linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#dff6ff'/>
      <stop offset='.65' stop-color='#f2fbe7'/>
      <stop offset='1' stop-color='#fff8df'/>
    </linearGradient>
    <linearGradient id='ground' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#9fce83'/>
      <stop offset='1' stop-color='#79b56b'/>
    </linearGradient>
    <linearGradient id='crocSkin' x1='0' y1='0' x2='.8' y2='1'>
      <stop offset='0' stop-color='#7fd05c'/>
      <stop offset='.55' stop-color='#51ae48'/>
      <stop offset='1' stop-color='#2f7e3d'/>
    </linearGradient>
    <linearGradient id='crocDark' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#4da747'/>
      <stop offset='1' stop-color='#256c37'/>
    </linearGradient>
    <linearGradient id='belly' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#e6f5a4'/>
      <stop offset='1' stop-color='#a9d767'/>
    </linearGradient>
    <linearGradient id='metal' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#eef5f3'/>
      <stop offset='.45' stop-color='#9aaca8'/>
      <stop offset='1' stop-color='#5b6b68'/>
    </linearGradient>
    <radialGradient id='sunGlow' cx='.5' cy='.5' r='.5'>
      <stop offset='0' stop-color='#fff6a9'/>
      <stop offset='.65' stop-color='#ffe46d'/>
      <stop offset='1' stop-color='#ffd24c' stop-opacity='0'/>
    </radialGradient>
    <filter id='softShadow' x='-30%' y='-30%' width='160%' height='160%'>
      <feDropShadow dx='0' dy='6' stdDeviation='7' flood-color='#17442f' flood-opacity='.18'/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width='900' height='600' fill='url(#sky)'/>
  <circle cx='752' cy='105' r='82' fill='url(#sunGlow)'/>
  <circle cx='752' cy='105' r='42' fill='#ffe96b' opacity='.9'/>
  <g class='cloud' fill='#ffffff' opacity='.72'>
    <ellipse cx='165' cy='105' rx='52' ry='24'/>
    <ellipse cx='205' cy='92' rx='43' ry='31'/>
    <ellipse cx='245' cy='108' rx='48' ry='22'/>
  </g>
  <g class='cloud two' fill='#ffffff' opacity='.55'>
    <ellipse cx='650' cy='150' rx='42' ry='18'/>
    <ellipse cx='682' cy='139' rx='32' ry='24'/>
    <ellipse cx='712' cy='152' rx='38' ry='17'/>
  </g>
  <path d='M0 448 Q130 390 275 432 T550 430 T900 408 L900 600 L0 600 Z' fill='#b9dfa0' opacity='.75'/>
  <path d='M0 490 Q180 452 360 485 T720 480 T900 466 L900 600 L0 600 Z' fill='url(#ground)'/>
  <g stroke='#5e9e59' stroke-width='3' stroke-linecap='round' opacity='.45'>
    <path d='M80 535 q8 -20 16 0'/>
    <path d='M120 548 q6 -15 12 0'/>
    <path d='M780 532 q7 -18 14 0'/>
    <path d='M822 548 q5 -14 10 0'/>
  </g>
  <ellipse cx='470' cy='535' rx='238' ry='18' fill='#245f3d' opacity='.16'/>

  <!-- 后轮 -->
  <g transform='translate(300 445)'>
    <g>
      <animateTransform attributeName='transform' attributeType='XML' type='rotate' from='0' to='360' dur='1.8s' repeatCount='indefinite'/>
      <circle r='82' fill='none' stroke='#173d38' stroke-width='12'/>
      <circle r='72' fill='none' stroke='#e7f0ed' stroke-width='4'/>
      <circle r='62' fill='none' stroke='#7fa49d' stroke-width='2' opacity='.75'/>
      <g stroke='#bfd2ce' stroke-width='2.6' stroke-linecap='round'>
        <line x1='0' y1='0' x2='0' y2='-68'/>
        <line x1='0' y1='0' x2='34' y2='-59'/>
        <line x1='0' y1='0' x2='59' y2='-34'/>
        <line x1='0' y1='0' x2='68' y2='0'/>
        <line x1='0' y1='0' x2='59' y2='34'/>
        <line x1='0' y1='0' x2='34' y2='59'/>
        <line x1='0' y1='0' x2='0' y2='68'/>
        <line x1='0' y1='0' x2='-34' y2='59'/>
        <line x1='0' y1='0' x2='-59' y2='34'/>
        <line x1='0' y1='0' x2='-68' y2='0'/>
        <line x1='0' y1='0' x2='-59' y2='-34'/>
        <line x1='0' y1='0' x2='-34' y2='-59'/>
      </g>
      <circle r='10' fill='url(#metal)' stroke='#52645f' stroke-width='3'/>
    </g>
  </g>

  <!-- 前轮 -->
  <g transform='translate(640 445)'>
    <g>
      <animateTransform attributeName='transform' attributeType='XML' type='rotate' from='0' to='360' dur='1.8s' repeatCount='indefinite'/>
      <circle r='82' fill='none' stroke='#173d38' stroke-width='12'/>
      <circle r='72' fill='none' stroke='#e7f0ed' stroke-width='4'/>
      <circle r='62' fill='none' stroke='#7fa49d' stroke-width='2' opacity='.75'/>
      <g stroke='#bfd2ce' stroke-width='2.6' stroke-linecap='round'>
        <line x1='0' y1='0' x2='0' y2='-68'/>
        <line x1='0' y1='0' x2='34' y2='-59'/>
        <line x1='0' y1='0' x2='59' y2='-34'/>
        <line x1='0' y1='0' x2='68' y2='0'/>
        <line x1='0' y1='0' x2='59' y2='34'/>
        <line x1='0' y1='0' x2='34' y2='59'/>
        <line x1='0' y1='0' x2='0' y2='68'/>
        <line x1='0' y1='0' x2='-34' y2='59'/>
        <line x1='0' y1='0' x2='-59' y2='34'/>
        <line x1='0' y1='0' x2='-68' y2='0'/>
        <line x1='0' y1='0' x2='-59' y2='-34'/>
        <line x1='0' y1='0' x2='-34' y2='-59'/>
      </g>
      <circle r='10' fill='url(#metal)' stroke='#52645f' stroke-width='3'/>
    </g>
  </g>

