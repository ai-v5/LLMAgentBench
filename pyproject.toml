[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmagentbench"
version = "0.1.0"
description = "Reproducible, code-first engineering agent evaluations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llmagentbench = "llmagentbench.cli:main"

[tool.setuptools.packages.find]
include = ["llmagentbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
